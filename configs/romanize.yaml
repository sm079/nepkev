  मिलाइदिनुहोस्: मिलाइदिनुस्
  गर्नुहोला: गर्नुस्

# Nepali words Romanized typists often write in English. Each message draws an English level
# (english_levels below); every listed word in it is then switched with that level's probability.
# Postpositions follow the same rule as loanwords: खाताबाट -> "account bata".
english:
  तर: but
  समस्या: problem
  खाता: account
  भुक्तानी: payment
  सहयोग: help
  छिटो: fast
  हिजो: yesterday
  आज: today
  भोलि: tomorrow
  हप्ता: week
  महिना: month
  गलत: wrong
  नयाँ: new
  फेरि: again
  जानकारी: info
  कृपया: please
  धन्यवाद: thanks
  रकम: amount
  कारोबार: transaction
  सन्देश: message
  सामान: item
  पहिला: first
  पहिले: first
  अझै: still
  मात्र: only
  सबै: all
  किन: why
  तुरुन्तै: urgently
  फोटो: photo

# English word -> chat abbreviation, each occurrence with abbrev_p.
abbreviations:
  please: [plz, pls]
  account: [acc]
  transaction: [txn]
  message: [msg]
  thanks: [thx, ty]
  bluetooth: [bt]
  amount: [amt]

# One typist profile per message: spellings vary between messages, consistent within one.
# Options per Devanagari sign with probabilities; the first option is the plain default.
typist_profile:
  छ: {chh: 0.45, ch: 0.25, x: 0.30}       # chha / cha / xa, chhaina / chaina / xaina
  भ: {bh: 0.60, v: 0.40}                  # bhayo / vayo
  फ: {ph: 0.60, f: 0.40}                  # phirta / firta
  व: {b: 0.60, v: 0.25, w: 0.15}               # व्यवहार -> byabahar / vyavahar
  श: {sh: 0.60, s: 0.40}
  ष: {sh: 0.60, s: 0.40}
  ी: {i: 0.85, ee: 0.15}
  ू: {u: 0.85, oo: 0.15}
  आ: {aa: 0.60, a: 0.40}                  # aayo / ayo

probabilities:
  contraction_p: 0.4
  english_levels:            # share of messages : probability of switching each listed word
    none: [0.25, 0.0]
    light: [0.50, 0.3]
    heavy: [0.25, 0.75]
  shorthand_p: 0.3           # one round amount: 5000 -> 5k
  abbrev_p: 0.5
  lowercase_p: 0.5
  drop_punct_p: 0.3
  double_punct_p: 0.15
