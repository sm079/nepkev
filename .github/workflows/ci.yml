name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nepkev
          POSTGRES_PASSWORD: nepkev
          POSTGRES_DB: nepkev_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nepkev -d nepkev_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      NEPKEV_TEST_DATABASE_URL: postgresql+psycopg://nepkev:nepkev@localhost:5432/nepkev_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.4"
          enable-cache: true
      - name: Install
        run: uv sync --locked --extra service
      - name: Lint
        run: uv run ruff check .
      - name: Test (without the slow real-model test)
        run: uv run pytest --cov --cov-report=term-missing --cov-fail-under=85
