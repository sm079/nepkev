# Capacity comparison: the same job as kev-0.8b on Kev-4B. Opt-in only; never the default.
# 4B in bf16 is ~8 GB of weights before activations and optimizer state for the adapter, so this asks for a 48 GB
# card first and keeps the per-step batch at 1 with gradient checkpointing (the job script always enables it).
gpu_types: ["NVIDIA L40S", "NVIDIA RTX A6000", "NVIDIA A40", "NVIDIA RTX 6000 Ada Generation"]
cloud_type: SECURE
image: runpod/pytorch:2.4.0-py3.11-cuda12.4.1-devel-ubuntu22.04
allowed_cuda_versions: ["12.8", "12.9", "13.0"]
container_disk_gb: 80
max_cost_per_hr: 1.50
max_minutes: 240

# Upstream pins (must match configs/upstream.yaml)
kev_commit: 5e42a7a03f28134853dd3ff77461457e921e5ec1
kev_model: jaredpalmer/kev-4b
kev_revision: 139fdd94f1b6a6ad80cc15e08fcb99cac885a101
kev_base: Qwen/Qwen3.5-4B-Base
kev_base_revision: 1001bb4d826a52d1f399e183466143f4da7b741b

# Same delta learning rate as 0.8B (upstream README: 2e-5) and the same effective batch of 8.
lr: 2.0e-5
batch: 1
accum: 8
# Kev's fine-tuning example uses 2 epochs. Each epoch is evaluated on dev and the lower dev NLL is kept
# (a 4-epoch run had its lowest dev NLL at epoch 2 and rose after).
epochs: 2
seed: 0
