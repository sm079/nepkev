name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: nepkev
          POSTGRES_PASSWORD: nepkev
          POSTGRES_DB: nepkev_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nepkev -d nepkev_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      NEPKEV_TEST_DATABASE_URL: postgresql+psycopg://nepkev:nepkev@localhost:5432/nepkev_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.4"
          enable-cache: true
      - name: Install
        run: uv sync --locked --extra service
      - name: Lint
        run: uv run ruff check .
      - name: Test (without the slow real-model test)
        run: uv run pytest --cov --cov-report=term-missing --cov-fail-under=85

  rag-gate:
    # Retrieval and refusal-gate quality on the eval set with the real embedding model; no LLM calls.
    # Fails when recall@5 or the gate's refusal recall drops below eval/baseline.json.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: nepkev
          POSTGRES_PASSWORD: nepkev
          POSTGRES_DB: nepkev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nepkev -d nepkev"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      NEPKEV_DATABASE_URL: postgresql+psycopg://nepkev:nepkev@localhost:5432/nepkev
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.4"
          enable-cache: true
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('nepkev/rag/embed.py') }}
      - name: Install
        run: uv sync --locked --extra service --extra rag
      - name: Migrate and ingest the knowledge base
        run: |
          uv run alembic upgrade head
          uv run python -m nepkev.rag.ingest
      - name: Quality gate
        run: uv run python -m nepkev.rag.eval --retrieval-only --check eval/baseline.json
