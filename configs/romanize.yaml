  हरू: haru
  नै: nai
  मै: mai
  पनि: pani

# Casual contractions, applied on the Devanagari side before romanizing (each occurrence with contraction_p).
contractions:
  भएको: भाको
  गएको: गाको
  आएको: आको
  रहेछ: रैछ
  भयो: भो
